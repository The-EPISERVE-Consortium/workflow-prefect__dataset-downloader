defaults:
  lakefs_repo: data-raw
  lakefs_processed_repo: data-processed
  lakefs_branch: main
  lakefs_commit_message: periodic download
  mariadb_database: episerve-raw-data
  run_daily: true
datasets:
  grippeweb:
    enabled: true
    display_name: GrippeWeb Weekly Report Data
    description: Weekly GrippeWeb participant reports and estimated incidence for acute respiratory illness in Germany. The dataset is stratified by season, illness type, age group, region, and calendar week.
    deployment_name: download__grippeweb
    parameters:
      source_url: https://raw.githubusercontent.com/robert-koch-institut/GrippeWeb_Daten_des_Wochenberichts/refs/heads/main/GrippeWeb_Daten_des_Wochenberichts.tsv
      lakefs_object_path: incidence/influenza/RKI__grippeweb.tsv
      mariadb_table: grippeweb
  influenza_cases_germany:
    enabled: true
    display_name: Laboratory-Confirmed Influenza Cases in Germany
    description: Weekly laboratory-confirmed influenza case counts and incidence from RKI IfSG surveillance. The dataset covers Germany and regional breakdowns by reporting week, region, and age group.
    deployment_name: download__influenza_cases_germany
    parameters:
      source_url: https://raw.githubusercontent.com/robert-koch-institut/Influenzafaelle_in_Deutschland/refs/heads/main/IfSG_Influenzafaelle.tsv
      lakefs_object_path: incidence/influenza/RKI__influenza_cases_germany.tsv
      mariadb_table: influenza_cases_germany
  corona_incidence_germany:
    enabled: true
    display_name: Germany COVID-19 7-Day Incidence
    description: Germany-wide COVID-19 case counts and 7-day incidence from RKI surveillance data. The dataset is organized by reporting date and age group and includes cumulative, new, and 7-day case metrics.
    deployment_name: download__corona_incidence_germany
    parameters:
      source_url: https://raw.githubusercontent.com/robert-koch-institut/COVID-19_7-Tage-Inzidenz_in_Deutschland/refs/heads/main/COVID-19-Faelle_7-Tage-Inzidenz_Deutschland.csv
      lakefs_object_path: incidence/covid/RKI__covid_germany.csv
      mariadb_table: corona_incidence_germany
  corona_incidence_states:
    enabled: true
    display_name: Federal State COVID-19 7-Day Incidence
    description: Federal-state COVID-19 case counts and 7-day incidence from RKI surveillance data. The dataset is organized by reporting date, federal state, and age group and includes cumulative, new, and 7-day case metrics.
    deployment_name: download__corona_incidence_states
    parameters:
      source_url: https://raw.githubusercontent.com/robert-koch-institut/COVID-19_7-Tage-Inzidenz_in_Deutschland/refs/heads/main/COVID-19-Faelle_7-Tage-Inzidenz_Bundeslaender.csv
      lakefs_object_path: incidence/covid/RKI__covid_states.csv
      mariadb_table: corona_incidence_states
  rsv_cases_germany:
    enabled: true
    display_name: Respiratory Syncytial Virus Cases in Germany
    description: Weekly respiratory syncytial virus case counts and incidence from RKI IfSG surveillance. The dataset covers Germany and regional breakdowns by reporting week, region, and age group.
    deployment_name: download__rsv_cases_germany
    parameters:
      source_url: https://raw.githubusercontent.com/robert-koch-institut/Respiratorische_Synzytialvirusfaelle_in_Deutschland/refs/heads/main/IfSG_RSVfaelle.tsv
      lakefs_object_path: incidence/rsv/RKI__rsv_cases_germany.tsv
      mariadb_table: rsv_cases_germany
  are_consultation_incidence:
    enabled: true
    display_name: Acute Respiratory Illness Consultation Incidence
    description: Weekly consultation incidence for acute respiratory illnesses in Germany. The dataset is stratified by season, calendar week, federal state, and age group.
    deployment_name: download__are_consultation_incidence
    parameters:
      source_url: https://raw.githubusercontent.com/robert-koch-institut/ARE-Konsultationsinzidenz/refs/heads/main/ARE-Konsultationsinzidenz.tsv
      lakefs_object_path: incidence/respiratory/RKI__are_consultation_incidence.tsv
      mariadb_table: are_consultation_incidence
  wastewater_surveillance_aggregate:
    enabled: true
    display_name: AMELAG Aggregated Wastewater Surveillance
    description: Aggregated AMELAG wastewater surveillance time series for respiratory pathogens. The dataset includes viral load, normalized viral load, model estimates, uncertainty bounds, sample counts, and covered population share.
    deployment_name: download__wastewater_surveillance_aggregate
    parameters:
      source_url: https://raw.githubusercontent.com/robert-koch-institut/Abwassersurveillance_AMELAG/refs/heads/main/amelag_aggregierte_kurve.tsv
      lakefs_object_path: wastewater/RKI__wastewater_surveillance_aggregate.tsv
      mariadb_table: wastewater_surveillance_aggregate
  wastewater_surveillance_stations:
    enabled: true
    display_name: AMELAG Site-Level Wastewater Surveillance
    description: Site-level AMELAG wastewater surveillance measurements for respiratory pathogens. The dataset includes location, federal state, date, viral load, normalized viral load, model estimates, population coverage, lab-change status, and detection-limit flags.
    deployment_name: download__wastewater_surveillance_stations
    parameters:
      source_url: https://raw.githubusercontent.com/robert-koch-institut/Abwassersurveillance_AMELAG/refs/heads/main/amelag_einzelstandorte.tsv
      lakefs_object_path: wastewater/RKI__wastewater_surveillance_stations.tsv
      mariadb_table: wastewater_surveillance_stations
  notaufnahme_surveillance:
    enabled: true
    display_name: Emergency Department Syndrome Surveillance
    description: Emergency department syndrome surveillance time series from RKI and the AKTIN emergency department registry. The dataset includes relative case shares, 7-day moving averages, expected values, uncertainty bounds, age groups, syndrome categories, and reporting emergency department counts.
    deployment_name: download__notaufnahme_surveillance
    parameters:
      source_url: https://raw.githubusercontent.com/robert-koch-institut/Daten_der_Notaufnahmesurveillance/refs/heads/main/Notaufnahmesurveillance_Zeitreihen_Syndrome.tsv
      lakefs_object_path: surveillance/emergency_dept/RKI__notaufnahme_surveillance.tsv
      mariadb_table: notaufnahme_surveillance
  sari_hospitalization_incidence:
    enabled: true
    display_name: SARI Hospitalization Incidence
    description: Weekly severe acute respiratory infection hospitalization incidence in Germany. The dataset is stratified by season, calendar week, age group, and SARI category.
    deployment_name: download__sari_hospitalization_incidence
    parameters:
      source_url: https://raw.githubusercontent.com/robert-koch-institut/SARI-Hospitalisierungsinzidenz/refs/heads/main/SARI-Hospitalisierungsinzidenz.tsv
      lakefs_object_path: surveillance/hospital/RKI__sari_hospitalization_incidence.tsv
      mariadb_table: sari_hospitalization_incidence
  covid_hospitalizations:
    enabled: true
    display_name: COVID-19 Hospitalizations in Germany
    description: COVID-19 hospitalization counts and incidence in Germany from RKI surveillance data. The dataset is stratified by date, federal state, and age group and includes fixed, updated, and nowcast-adjusted 7-day hospitalization metrics.
    deployment_name: download__covid_hospitalizations
    parameters:
      source_url: https://raw.githubusercontent.com/robert-koch-institut/COVID-19-Hospitalisierungen_in_Deutschland/refs/heads/main/Aktuell_Deutschland_adjustierte-COVID-19-Hospitalisierungen.csv
      lakefs_object_path: surveillance/hospital/RKI__covid_hospitalizations.csv
      mariadb_table: covid_hospitalizations
  weather_berlin_daily:
    enabled: true
    display_name: Berlin Daily Weather
    description: Daily Open-Meteo weather data for Berlin. The dataset includes maximum, minimum, and mean 2 m air temperature for the configured recent date window.
    deployment_name: download__weather_berlin_daily
    parameters:
      source_url: "https://api.open-meteo.com/v1/forecast?latitude=52.52&longitude=13.41&daily=temperature_2m_max,temperature_2m_min,temperature_2m_mean&past_days=10&format=csv&timezone=Europe%2FBerlin"
      source_skiprows: 3
      lakefs_object_path: climate/temperature/open-meteo__weather_berlin_daily.csv
      lakefs_commit_message: new version from Open-Meteo
      mariadb_table: weather_berlin_daily
      mariadb_primary_key: time
  weather_berlin_hourly:
    enabled: true
    display_name: Berlin Hourly Weather
    description: Hourly Open-Meteo weather data for Berlin. The dataset includes 2 m air temperature, relative humidity, and precipitation for the configured recent date window.
    deployment_name: download__weather_berlin_hourly
    parameters:
      source_url: "https://api.open-meteo.com/v1/forecast?latitude=52.52&longitude=13.41&hourly=temperature_2m,relative_humidity_2m,precipitation&past_days=3&format=csv&timezone=Europe%2FBerlin"
      source_skiprows: 3
      lakefs_object_path: climate/temperature/open-meteo__weather_berlin_hourly.csv
      lakefs_commit_message: new version from Open-Meteo
      mariadb_table: weather_berlin_hourly
      mariadb_primary_key: time
